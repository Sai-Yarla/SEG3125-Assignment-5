<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Note Head (Bauhaus Red) -->
  <circle cx="90" cy="180" r="50" fill="#D02020" stroke="#121212" stroke-width="12" />
  
  <!-- Stem (Black) -->
  <rect x="130" y="40" width="12" height="140" fill="#121212" />
  
  <!-- Flag (Bauhaus Yellow) -->
  <polygon points="142,40 230,120 142,120" fill="#F0C020" stroke="#121212" stroke-width="12" stroke-linejoin="round" />
  
  <!-- Bauhaus Blue Accent (Small rotated square) -->
  <rect x="25" y="40" width="45" height="45" fill="#1040C0" stroke="#121212" stroke-width="8" transform="rotate(15 45 60)" />
</svg>